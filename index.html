<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Midterm Quest — тренажёр по Academic Writing: тесты, шпаргалки, работа над ошибками.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<title>Midterm Quest</title>
<style>
:root{color-scheme:light dark;--bg:#f5f3ff;--card:#fff;--tx:#1c1a2e;--mu:#6b6885;--pr:#6c4cf1;--ok:#1e9e5a;--okb:#e3f7ec;--no:#d63b4b;--nob:#fde8eb;--bd:#e2dff5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#1f1c3d;--tx:#f1efff;--mu:#a8a4c8;--pr:#7e63f5;--ok:#3ecf86;--okb:#12372a;--no:#ff6b7a;--nob:#3d1a22;--bd:#38336a}}
:root[data-theme="dark"]{--bg:#14122a;--card:#1f1c3d;--tx:#f1efff;--mu:#a8a4c8;--pr:#7e63f5;--ok:#3ecf86;--okb:#12372a;--no:#ff6b7a;--nob:#3d1a22;--bd:#38336a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:680px;margin:0 auto;padding:12px 14px 40px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:5px 0;cursor:pointer;text-align:left;width:100%}
button:active{transform:scale(.98)}button:disabled{opacity:.5}
.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
.big{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px}.row button{text-align:center}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin:8px 0}
.card p{margin:6px 0}.card small{display:block;color:var(--pr);margin:2px 0 6px}
.q{font-size:18px;font-weight:600;margin:0 0 8px}
.tr{width:auto;padding:6px 12px;font-size:14px}
.trn{color:var(--pr);margin:8px 0 0;font-weight:500}
.opt{display:flex;gap:10px;align-items:flex-start}
.opt b{background:var(--bd);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;flex:none}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.fb{border-radius:14px;padding:12px;margin:10px 0}.fb p{margin:6px 0 0}
.g{background:var(--okb);border:2px solid var(--ok)}.b{background:var(--nob);border:2px solid var(--no)}
.prog{color:var(--mu);font-size:14px}small{color:var(--mu)}.pr small{color:#fff}
.sa{background:var(--okb);border-left:4px solid var(--ok);padding:4px 8px;border-radius:8px;font-weight:600}.so{color:var(--mu)}.ex{font-size:14px}
</style></head><body><div id="app"></div>
<script>
const Q=[],q=(v,t,o,c,r,e)=>Q.push({id:Q.length,v,t,o:o.split("|"),c,r,e});
const P="Search for relevant journals/books/information in the library and on the Internet.",W="Write the contents page, bibliography, title page and abstract.",ED="Edit the draft - decide objectively whether your ideas have been expressed clearly",WT="Think of a working title for the project",RD="Read the first draft.";
q("A","How many stages are there in producing an extended essay or project?","2|3|5|4|0",1,"Сколько этапов в создании расширенного эссе или проекта?","Три этапа: Planning, Researching, Writing up.");
q("A","Which step is related to the stage of Planning?",WT+".|"+P+"|"+W+"|Do some reading|"+ED,0,"Какой шаг относится к этапу Planning?","Planning: рабочее название, фокус, черновой план, проверка источников. Поиск и чтение - это Researching, оглавление и правка - Writing up.");
q("A","Which step is related to the stage of Planning?",P+"|"+W+"|Work on establishing a clear focus.|Do some reading|"+ED,2,"Какой шаг относится к этапу Planning?","Установить чёткий фокус (clear focus) - это Planning.");
q("A","Which step is related to the stage of Planning?",P+"|"+W+"|Do some reading|Plan the content in detail.|"+ED,3,"Какой шаг относится к этапу Planning?","Подробно спланировать содержание - это Planning.");
q("A","Which step is related to the stage of Researching?","Work on establishing a clear focus.|Plan the content in detail.|"+RD+"|Do some reading|"+WT,3,"Какой шаг относится к этапу Researching?","Do some reading (почитать по теме) - Researching. Read the first draft - уже Writing up.");
q("A","Which step is related to the stage of Researching?","Decide if you need to do more reading.|Plan the content in detail.|"+RD+"|"+ED+"|"+WT,0,"Какой шаг относится к этапу Researching?","Решить, нужно ли ещё читать - Researching.");
q("A","Which step is related to the stage of Researching?","Plan the content in detail.|"+RD+"|"+ED+"|Highlight/take notes of the relevant information|"+WT,3,"Какой шаг относится к этапу Researching?","Выделять и конспектировать нужную информацию - Researching.");
q("A","Which step is related to the stage of Writing up?","Decide on a topic|Plan the content in detail|Make a rough outline plan of your ideas.|Check that sources are available/accessible.|"+W,4,"Какой шаг относится к этапу Writing up?","Оглавление, библиография, титульная страница и аннотация пишутся в конце - Writing up.");
q("A","Which step is related to the stage of Writing up?","Decide on a topic|Plan the content in detail|Make a rough outline plan of your ideas.|Write the first complete draft.|Check that sources are available/accessible.",3,"Какой шаг относится к этапу Writing up?","Первый полный черновик - Writing up.");
q("A","Which step is related to the stage of Writing up?","Decide on a topic|Plan the content in detail|"+ED+"|Make a rough outline plan of your ideas.|Check that sources are available/accessible.",2,"Какой шаг относится к этапу Writing up?","Редактировать черновик и проверить, ясно ли выражены идеи - Writing up.");
q("A","This describes research","Essay|Thesis|Case study|Report|Dissertation",3,"Это описывает исследование...","⚠️ В скриншоте вопрос обрезан, ответ моё лучшее предположение. Report - описание исследования или проекта. Case study - разбор одного конкретного случая.");
q("A","This is longer than a dissertation","Essay|Thesis|Case study|Report|Dissertation",1,"Это длиннее, чем dissertation","Thesis (докторская) длиннее dissertation (бакалаврская или магистерская).");
q("A","The example of critical thinking:","evaluating the credibility of the writer’s sources|reading as quickly as possible|citing the exact words of the author|organise your piece of work|cutting and pasting a short article from a website, with no citation.",0,"Пример критического мышления:","Critical thinking: оценка надёжности источников автора. Копипаст без ссылки - плагиат.");
q("A","The example of critical thinking:","reading as quickly as possible|citing the exact words of the author|organise your piece of work|cutting and pasting a short article from a website, with no citation.|identifying the writer’s purpose",4,"Пример критического мышления:","Определять цель автора (inform, persuade, refute, support) - это critical thinking.");
q("A","to show you can ______ evidence to support ideas","dispute|develop|display|provide",3,"показать, что вы можете ______ доказательства в поддержку идей","Provide evidence - приводить доказательства.");
q("A","to show you can ______ or support existing theories (this demonstrates critical thinking ability)","dispute|develop|display|provide|assess",0,"показать, что вы можете ______ или поддержать существующие теории","Dispute (оспорить) or support - студенты пишут, чтобы оспорить или поддержать теории.");
q("A","To show evidence of independent investigation is the ------","Preliminary Literature Review|Research questions|Aim|Detailed Research Methodology|A working title",2,"Показать самостоятельное исследование - это ------","Aim (цель диссертации): показать самостоятельное исследование.");
q("A","The ------ are more specific than your research objectives and specify the various insights/information that need to be collected in order to achieve the objectives. Keep in mind that the research question often starts with a Why, How, or What.","Preliminary Literature Review|Research questions|Aim|Detailed Research Methodology|Objectives",1,"------ конкретнее целей и определяют, какую информацию нужно собрать","Research questions конкретнее objectives и часто начинаются с Why, How, What.");
q("A","To put into practice theories and concepts learned on the programme is the -----","Preliminary Literature Review|Research questions|Aim|Detailed Research Methodology|Objectives",2,"Применить на практике теории и концепции программы - это -----","Aim: применить на практике изученные теории и концепции.");
q("A","The ______ of the research provides a description of what you want to achieve from carrying out this research.","Preliminary Literature Review|Research questions|Aim|Detailed Research Methodology|Objectives",2,"______ исследования описывает, чего вы хотите достичь","⚠️ Варианты в скриншоте обрезаны (взяты как в соседних вопросах). Aim - то, чего вы хотите достичь.");
q("B","Paraphrasing is ....","writing the ideas of another person in your own words.|copying the ideas of another person.|refuting another person’s idea.|writing about another person.|giving your idea about one’s opinion",0,"Парафраз - это ....","Paraphrasing: изложить идеи другого человека своими словами.");
q("B","In paraphrasing you should ....","keep the meaning the same.|change the words and the structure.|change the words and the structure but keep the meaning the same.|change the structure of the sentence and add your opinion.|keep the main idea but add your opinion.",2,"При парафразе нужно ....","Полный ответ C: поменять слова и структуру, но сохранить смысл. A и B верны лишь частично, а мнение добавлять нельзя.");
q("B","The process of paraphrasing involves the following stages except:","Copy the main idea into your research.|Read and understand the text|Find the important ideas - the important words/phrases.|Find alternative words/synonyms for these words/phrases.|Rewrite the main ideas in complete sentences.",0,"Процесс парафраза включает следующие этапы, кроме:","⚠️ В скриншоте виден только вариант A, остальные подставлены из соседних вопросов. Копировать идею нельзя - её переписывают своими словами.");
q("B","The process of paraphrasing involves the following stages except:","Do not change specialized vocabulary and common words|Read and understand the text|Change the main idea.|Change the structure of the text.|Identify the meaning relationships between the words/ideas - e.g. cause/effect, generalization, contrast.",2,"Парафраз включает следующие этапы, кроме:","Главную идею менять нельзя: смысл остаётся тем же. Специальные термины и общие слова не меняют.");
q("B","The process of paraphrasing involves the following stages except:","Find the important ideas - the important words/phrases.|Find alternative words/synonyms for these words/phrases.|Change the grammar of the text.|Change structure and volume of the text.|Rewrite the main ideas in complete sentences.",3,"Парафраз включает следующие этапы, кроме:","⚠️ Объём менять не нужно: проверка парафраза требует сохранить похожую длину. Меняют слова и грамматику.");
q("B","When you check your paraphrased text you should ....","Make sure the meaning is the same.|Try to be concise and keep a similar length (not easy!)|Make sure you didn’t change the idea.|Make sure the style is your own.|Remember to acknowledge other people’s work.",0,"Проверяя свой парафраз, нужно ....","⚠️ Здесь верны почти все варианты, ключа нет. Главное - смысл тот же (A), длина похожая, стиль свой, источник указан.");
q("B","What is a summary?","It is written by the author of the article.|It is a shortened version of another author’s writing.|It includes your response to the ideas of the article.|It includes the most important idea of the article but some points can be copied from the original.|It includes the ideas from the original text and your viewpoint.",1,"Что такое summary?","Summary - сокращённая версия чужого текста: только главное, своими словами, без вашего мнения и без копирования.");
q("B","What is not necessary when you summarize another author’s writing?","Read the passage quickly.|Change the whole text into your own text.|Find the most important supporting details.|In your own words, give the author’s main idea and main supporting ideas in a few sentences per paragraph.|Use reporting verbs.",1,"Что НЕ обязательно при резюмировании чужого текста?","⚠️ Переписывать весь текст не нужно - это парафраз, а в summary даются только главная мысль и основные детали. Быстрое чтение тоже не метод, поэтому A - второй кандидат.");
q("B","Which is not founded (found) in the academic paper?","Title and Abstract|Introduction and conclusion|Headings and topic sentences|Diagrams and charts|Table of contents and blurb",4,"Что НЕ встречается в научной статье?","Blurb - реклама на обложке книги, в научной статье её нет. Остальное (title, abstract, introduction, headings, charts) бывает.");
q("B","Which is not founded (found) in the essay?","Table of contents and preface|Introduction and conclusion|Thesis statement and topic sentences|Body paragraphs|In-text references",0,"Что НЕ встречается в эссе?","⚠️ В скриншоте видны только варианты A и B. Оглавление и предисловие - для книг и больших работ, в эссе их нет.");
const V=v=>Q.filter(x=>x.v==v);
const $=s=>document.querySelector(s),app=$("#app"),sh=a=>[...a].sort(()=>Math.random()-.5);
let S={xp:0,best:0,st:{},mix:false},run=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("mid1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("mid1",JSON.stringify(S))}catch(e){}};
const head=()=>`<div class="hd"><b>🎓 Midterm Quest</b><span>Lv ${Math.floor(S.xp/100)+1} · ${S.xp} XP · 🔥${S.best}</span></div><div class="bar"><i style="width:${S.xp%100}%"></i></div>`;
const dn=L=>L.filter(x=>S.st[x.id]&&S.st[x.id].l===1).length;
function home(){
 const wr=Q.filter(x=>S.st[x.id]&&S.st[x.id].l===0);
 app.innerHTML=head()+`<div class="card"><b>ℹ️ Формат</b><p>Midterm: тест по пройденному или summary статьи; затем презентация с графиками или эссе 1200-1500 слов. Final: устный экзамен - 1) объяснить ключевые пункты вопроса, 2) проанализировать статью, 3) представить research paper.</p></div><p class="prog">⚠️ В файле экзамена нет ключа ответов: ответы выведены из материалов курса. Где я не уверен, стоит значок ⚠️.</p>`+
 `<button class="big pr" onclick="go(V('A'),1)"><span>⚔️ Вариант A по порядку</span><small>${dn(V("A"))}/${V("A").length}</small></button><button class="big pr" onclick="go(V('B'),1)"><span>⚔️ Вариант B по порядку</span><small>${dn(V("B"))}/${V("B").length}</small></button><button class="big" onclick="go(Q,0)"><span>🔀 Всё вперемешку</span><small>${Q.length}</small></button><button class="big" onclick="go(Q.filter(x=>S.st[x.id]&&S.st[x.id].l===0),0)" ${wr.length?"":"disabled"}><span>🔁 Работа над ошибками</span><small>${wr.length}</small></button><div class="row"><button onclick="study('A')">📖 Шпаргалка A</button><button onclick="study('B')">📖 Шпаргалка B</button></div><button onclick="S.mix=!S.mix;save();home()">${S.mix?"🔀 Варианты ответов перемешаны":"🔢 Варианты в том же порядке, что на экзамене"} (нажми, чтобы сменить)</button>`}
function go(L,o){run={L:o?L:sh(L),i:0,ok:0,combo:0,a:null,miss:[]};show()}
function show(){
 const r=run;if(r.i>=r.L.length)return res();const x=r.L[r.i],n=x.o.map((_,k)=>k);r.ord=S.mix?sh(n):n;
 app.innerHTML=head()+`<div class="prog">${r.i+1}/${r.L.length} · Вариант ${x.v} · combo x${r.combo}</div><div class="card"><p class="q">${x.t}</p><button class="tr" onclick="tog()">🌐 Перевод</button><p id="trn" class="trn" hidden>${x.r}</p></div>`+r.ord.map((j,k)=>`<button class="opt" onclick="pick(${k})"><b>${"ABCDE"[k]}</b><span>${x.o[j]}</span></button>`).join("")+`<div id="fb"></div><button onclick="home()">← Меню</button>`}
function tog(){const t=$("#trn");t.hidden=!t.hidden}
function pick(k){
 const r=run,x=r.L[r.i];if(r.a!=null)return;r.a=k;
 const ci=r.ord.indexOf(x.c),ok=k==ci,s=S.st[x.id]||(S.st[x.id]={ok:0,bad:0}),g=10+Math.min(r.combo+1,5)*2;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.style.opacity=1;if(j==ci)b.classList.add("ok");else if(j==k)b.classList.add("no")});
 if(ok){r.ok++;r.combo++;s.ok++;s.l=1;S.xp+=g;S.best=Math.max(S.best,r.combo)}else{r.combo=0;s.bad++;s.l=0;r.miss.push(x)}
 save();
 $("#fb").innerHTML=`<div class="fb ${ok?"g":"b"}"><b>${ok?"✅ Верно! +"+g+" XP":"❌ Неверно. Правильный ответ: "+"ABCDE"[ci]}</b><p>${x.e}</p></div><button class="big pr" onclick="nxt()">Дальше →</button>`;
 $("#fb").scrollIntoView({behavior:"smooth",block:"center"})}
function nxt(){run.i++;run.a=null;show();window.scrollTo(0,0)}
function res(){
 const r=run,p=Math.round(r.ok/r.L.length*100);
 app.innerHTML=head()+`<div class="card"><h2>${p>=80?"🏆":p>=50?"👍":"💪"} ${r.ok}/${r.L.length} (${p}%)</h2><p>${p>=80?"Отлично, ты готов!":"Повтори ошибки - так запомнится лучше."}</p></div>`+(r.miss.length?`<h3>Ошибки</h3>`+r.miss.map(x=>`<div class="fb b"><b>${x.t}</b><p>✔ ${x.o[x.c]}</p><p>${x.e}</p></div>`).join("")+`<button class="big pr" onclick="go(run.miss,1)">🔁 Повторить ошибки</button>`:"")+`<button onclick="home()">← Меню</button>`}
function study(v){
 app.innerHTML=head()+`<h2>📖 Вариант ${v}: вопросы и ответы</h2>`+V(v).map((x,i)=>`<div class="card"><b>${i+1}. ${x.t}</b><small>${x.r}</small>${x.o.map((o,k)=>`<p class="${k==x.c?"sa":"so"}">${"abcde"[k]}) ${o}${k==x.c?" ✅":""}</p>`).join("")}<p class="ex">${x.e}</p></div>`).join("")+`<button onclick="home()">← Меню</button>`}
home();
</script></body></html>
